<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shipments — SCM Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebar-container"></div>
      <main class="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Shipments</h1>
            <p class="page-header__subtitle" id="shipments-subtitle">
              Loading…
            </p>
          </div>
          <div class="page-header__actions">
            <button class="btn btn--primary" id="btn-new-shipment">
              <i data-lucide="plus" style="width: 16px; height: 16px"></i> New
              Shipment
            </button>
          </div>
        </div>

        <!-- Metrics -->
        <div class="metric-row" id="shipment-metrics">
          <div class="metric-card skeleton-h"></div>
          <div class="metric-card skeleton-h"></div>
          <div class="metric-card skeleton-h"></div>
          <div class="metric-card skeleton-h"></div>
        </div>

        <!-- Pipeline -->
        <section class="section">
          <div class="section-head">
            <h2 class="section-head__title">Shipment Pipeline</h2>
            <span class="text-xs text-muted" id="ship-pipeline-hint"
              >Click a stage to filter</span
            >
          </div>
          <div id="shipment-pipeline"></div>
        </section>

        <!-- Filters -->
        <div class="toolbar" style="margin-bottom: 0.75rem">
          <div class="toolbar__search">
            <i class="toolbar__search-icon" data-lucide="search"></i>
            <input
              id="shipment-search"
              class="form-input"
              type="text"
              placeholder="Search tracking, order, or shipment ID"
            />
          </div>
          <select class="toolbar__select" id="shipment-status-filter">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="picked_up">Picked Up</option>
            <option value="in_transit">In Transit</option>
            <option value="out_for_delivery">Out for Delivery</option>
            <option value="exception">Exception</option>
            <option value="delivered">Delivered</option>
            <option value="returned">Returned</option>
          </select>
          <select class="toolbar__select" id="shipment-carrier-filter">
            <option value="">All Carriers</option>
          </select>
        </div>

        <!-- Insights -->
        <div class="grid-2" style="margin-bottom: 0.75rem">
          <div class="panel">
            <div class="panel__head">
              <h3 class="panel__title">Carrier Mix</h3>
            </div>
            <div class="panel__body">
              <div
                class="chart-wrap"
                id="carrier-chart-wrap"
                style="height: 220px"
              >
                <canvas id="carrier-chart"></canvas>
              </div>
            </div>
          </div>
          <div class="panel">
            <div class="panel__head">
              <h3 class="panel__title">Delivery Flow Health</h3>
            </div>
            <div class="panel__body" id="shipment-health"></div>
          </div>
        </div>

        <!-- Table + Pagination -->
        <div class="table-wrapper" id="shipments-table-container"></div>
        <div id="shipments-pagination" style="padding: 0.5rem 1rem"></div>
      </main>
    </div>

    <!-- Create Shipment Modal -->
    <div class="modal-backdrop" id="create-modal" style="display: none">
      <div class="modal" style="max-width: 520px">
        <div class="modal__header">
          <h3 class="modal__title">Create Shipment</h3>
          <button class="modal__close" id="create-modal-close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal__body">
          <div class="form-group">
            <label class="form-label">Order ID</label>
            <input
              type="text"
              class="form-input"
              id="create-order"
              placeholder="Order ID"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Carrier</label>
            <select class="form-select" id="create-carrier">
              <option value="">Select carrier</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Origin Warehouse</label>
            <select class="form-select" id="create-warehouse">
              <option value="">Select warehouse</option>
            </select>
          </div>
        </div>
        <div class="modal__footer">
          <button class="btn btn--ghost" id="create-modal-cancel">
            Cancel
          </button>
          <button class="btn btn--primary" id="create-modal-submit">
            Create
          </button>
        </div>
      </div>
    </div>

    <!-- Status Update Modal -->
    <div class="modal-backdrop" id="status-modal" style="display: none">
      <div class="modal">
        <div class="modal__header">
          <h3 class="modal__title">Update Shipment Status</h3>
          <button class="modal__close" id="status-modal-close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal__body">
          <p id="status-modal-info" class="text-sm text-muted mb-3"></p>
          <div class="form-group">
            <label class="form-label">New Status</label>
            <select class="form-select" id="status-modal-select">
              <option value="pending">Pending</option>
              <option value="picked_up">Picked Up</option>
              <option value="in_transit">In Transit</option>
              <option value="out_for_delivery">Out for Delivery</option>
              <option value="exception">Exception</option>
              <option value="delivered">Delivered</option>
              <option value="returned">Returned</option>
            </select>
          </div>
        </div>
        <div class="modal__footer">
          <button class="btn btn--ghost" id="status-modal-cancel">
            Cancel
          </button>
          <button class="btn btn--primary" id="status-modal-confirm">
            Update
          </button>
        </div>
      </div>
    </div>

    <!-- Shipment Detail Modal -->
    <div class="modal-backdrop" id="detail-modal" style="display: none">
      <div class="modal" style="max-width: 640px">
        <div class="modal__header">
          <h3 class="modal__title" id="detail-modal-title">Shipment Detail</h3>
          <button class="modal__close" id="detail-modal-close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal__body" id="detail-modal-body"></div>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="../js/shipments.js"></script>
  </body>
</html>
