<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory — SCM Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebar-container"></div>
      <main class="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Inventory</h1>
            <p class="page-header__subtitle" id="inv-subtitle">Loading…</p>
          </div>
          <div class="page-header__actions">
            <button class="btn btn--secondary" id="btn-receive">
              <i
                data-lucide="package-plus"
                style="width: 16px; height: 16px"
              ></i>
              Receive
            </button>
            <button class="btn btn--secondary" id="btn-transfer">
              <i
                data-lucide="arrow-right-left"
                style="width: 16px; height: 16px"
              ></i>
              Transfer
            </button>
            <button class="btn btn--secondary" id="btn-adjust">
              <i data-lucide="sliders" style="width: 16px; height: 16px"></i>
              Adjust
            </button>
          </div>
        </div>

        <!-- Analytics Metrics -->
        <div class="metric-row" id="inv-metrics">
          <div class="metric-card skeleton-h"></div>
          <div class="metric-card skeleton-h"></div>
          <div class="metric-card skeleton-h"></div>
          <div class="metric-card skeleton-h"></div>
        </div>

        <!-- Tabs -->
        <div class="tab-bar" id="inv-tabs">
          <button class="tab-bar__item active" data-tab="stock">
            Stock Levels
          </button>
          <button class="tab-bar__item" data-tab="movements">Movements</button>
          <button class="tab-bar__item" data-tab="lowstock">
            Low Stock <span class="tab-count" id="lowstock-count"></span>
          </button>
        </div>

        <!-- Stock Tab -->
        <div class="tab-panel active" id="tab-stock">
          <div class="toolbar">
            <div class="toolbar__search">
              <i data-lucide="search"></i>
              <input
                type="text"
                class="form-input"
                id="stock-search"
                placeholder="Search products…"
              />
            </div>
            <select class="form-select" id="stock-warehouse-filter">
              <option value="">All warehouses</option>
            </select>
          </div>
          <div class="table-wrapper" id="stock-table-container"></div>
          <div id="stock-pagination"></div>
        </div>

        <!-- Movements Tab -->
        <div class="tab-panel" id="tab-movements" style="display: none">
          <div id="movements-container"></div>
          <div id="movements-pagination"></div>
        </div>

        <!-- Low Stock Tab -->
        <div class="tab-panel" id="tab-lowstock" style="display: none">
          <div id="lowstock-container"></div>
        </div>
      </main>
    </div>

    <!-- Receive Stock Modal -->
    <div class="modal-backdrop" id="receive-modal" style="display: none">
      <div class="modal">
        <div class="modal__header">
          <h3 class="modal__title">Receive Stock</h3>
          <button class="modal__close" id="receive-modal-close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal__body">
          <div class="form-group">
            <label class="form-label">Product ID</label>
            <input
              type="text"
              class="form-input"
              id="receive-product"
              placeholder="Product UUID"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Warehouse ID</label>
            <input
              type="text"
              class="form-input"
              id="receive-warehouse"
              placeholder="Warehouse UUID"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Quantity</label>
            <input
              type="number"
              class="form-input"
              id="receive-qty"
              min="1"
              placeholder="Quantity"
            />
          </div>
        </div>
        <div class="modal__footer">
          <button class="btn btn--ghost" id="receive-modal-cancel">
            Cancel
          </button>
          <button class="btn btn--primary" id="receive-modal-submit">
            Receive
          </button>
        </div>
      </div>
    </div>

    <!-- Transfer Stock Modal -->
    <div class="modal-backdrop" id="transfer-modal" style="display: none">
      <div class="modal">
        <div class="modal__header">
          <h3 class="modal__title">Transfer Stock</h3>
          <button class="modal__close" id="transfer-modal-close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal__body">
          <div class="form-group">
            <label class="form-label">Product ID</label>
            <input
              type="text"
              class="form-input"
              id="transfer-product"
              placeholder="Product UUID"
            />
          </div>
          <div class="form-group">
            <label class="form-label">From Warehouse</label>
            <input
              type="text"
              class="form-input"
              id="transfer-from"
              placeholder="From warehouse UUID"
            />
          </div>
          <div class="form-group">
            <label class="form-label">To Warehouse</label>
            <input
              type="text"
              class="form-input"
              id="transfer-to"
              placeholder="To warehouse UUID"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Quantity</label>
            <input
              type="number"
              class="form-input"
              id="transfer-qty"
              min="1"
              placeholder="Quantity"
            />
          </div>
        </div>
        <div class="modal__footer">
          <button class="btn btn--ghost" id="transfer-modal-cancel">
            Cancel
          </button>
          <button class="btn btn--primary" id="transfer-modal-submit">
            Transfer
          </button>
        </div>
      </div>
    </div>

    <!-- Adjust Stock Modal -->
    <div class="modal-backdrop" id="adjust-modal" style="display: none">
      <div class="modal">
        <div class="modal__header">
          <h3 class="modal__title">Adjust Stock</h3>
          <button class="modal__close" id="adjust-modal-close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal__body">
          <div class="form-group">
            <label class="form-label">Product ID</label>
            <input
              type="text"
              class="form-input"
              id="adjust-product"
              placeholder="Product UUID"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Warehouse ID</label>
            <input
              type="text"
              class="form-input"
              id="adjust-warehouse"
              placeholder="Warehouse UUID"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Quantity Delta</label>
            <input
              type="number"
              class="form-input"
              id="adjust-qty"
              placeholder="+10 to add, -5 to remove"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Reason</label>
            <input
              type="text"
              class="form-input"
              id="adjust-reason"
              placeholder="Reason for adjustment"
            />
          </div>
        </div>
        <div class="modal__footer">
          <button class="btn btn--ghost" id="adjust-modal-cancel">
            Cancel
          </button>
          <button class="btn btn--primary" id="adjust-modal-submit">
            Adjust
          </button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="../js/inventory.js"></script>
  </body>
</html>
