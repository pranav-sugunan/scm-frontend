<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory — SCM Platform</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/layout.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <style>
    /* Inline tab styles */
    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--clr-border);
      margin-bottom: 1rem;
    }

    .tab-btn {
      padding: .625rem 1.25rem;
      font-size: .875rem;
      font-weight: 500;
      color: var(--clr-text-secondary);
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: .375rem;
    }

    .tab-btn:hover {
      color: var(--clr-text);
    }

    .tab-btn.active {
      color: var(--clr-primary);
      border-bottom-color: var(--clr-primary);
      font-weight: 600;
    }

    .tab-btn .tab-badge {
      background: var(--clr-danger);
      color: white;
      font-size: .625rem;
      font-weight: 700;
      padding: .125rem .375rem;
      border-radius: 99px;
      min-width: 18px;
      text-align: center;
    }

    .warehouse-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>

    <div style="flex:1;min-width:0">
      <div id="navbar-container"></div>

      <main class="main-content">

        <!-- Page Header -->
        <div class="page-header">
          <div class="page-header__left">
            <h1 class="page-header__title">Inventory</h1>
            <p class="page-header__subtitle">Real-time stock levels, movements & alerts</p>
          </div>
          <div class="page-header__actions">
            <span class="badge badge--info" style="font-size:.75rem;padding:.375rem .75rem">
              Auto-refresh 10s
            </span>
          </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
          <div class="toolbar__search">
            <svg class="toolbar__search-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="search" class="toolbar__search-input"
              id="search-inventory" placeholder="Search by SKU, product name…" autocomplete="off"/>
          </div>
          <div class="toolbar__sep"></div>
          <div class="toolbar__filter-group">
            <span class="toolbar__filter-label">Warehouse:</span>
            <select class="toolbar__select" id="filter-inv-warehouse">
              <option value="">All Warehouses</option>
            </select>
          </div>
        </div>

        <!-- Tabs -->
        <div class="tab-bar">
          <button class="tab-btn active" data-tab="stock">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              style="width:15px;height:15px">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
            </svg>
            Stock Levels
          </button>
          <button class="tab-btn" data-tab="movements">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              style="width:15px;height:15px">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
            </svg>
            Movements
          </button>
          <button class="tab-btn" data-tab="alerts">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              style="width:15px;height:15px">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
            Low Stock Alerts
            <span class="tab-badge" id="low-stock-badge" style="display:none">0</span>
          </button>
        </div>

        <!-- Dynamic Content Area -->
        <div id="inventory-content">
          <div class="skeleton" style="height:400px;border-radius:14px"></div>
        </div>

        <!-- Pagination -->
        <div id="inventory-pagination"></div>

      </main>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script type="module" src="../js/inventory.js"></script>
</body>
</html>
