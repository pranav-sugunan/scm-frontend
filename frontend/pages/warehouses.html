<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Warehouses — SCM Platform</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/layout.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <style>
    .warehouse-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>

    <div style="flex:1;min-width:0">
      <div id="navbar-container"></div>

      <main class="main-content">

        <!-- Page Header -->
        <div class="page-header">
          <div class="page-header__left">
            <h1 class="page-header__title">Warehouses</h1>
            <p class="page-header__subtitle">Facilities, zones, and bin management</p>
          </div>
        </div>

        <!-- Summary KPIs -->
        <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:1.75rem">
          <div class="kpi-card kpi-card--blue">
            <div class="kpi-card__header">
              <div class="kpi-card__icon-wrap kpi-card__icon-wrap--blue">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
              </div>
            </div>
            <div class="kpi-card__value" id="stat-total-wh">—</div>
            <div class="kpi-card__label">Total Warehouses</div>
          </div>

          <div class="kpi-card kpi-card--green">
            <div class="kpi-card__header">
              <div class="kpi-card__icon-wrap kpi-card__icon-wrap--green">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
              </div>
            </div>
            <div class="kpi-card__value" id="stat-active-wh">—</div>
            <div class="kpi-card__label">Active</div>
          </div>

          <div class="kpi-card kpi-card--purple">
            <div class="kpi-card__header">
              <div class="kpi-card__icon-wrap kpi-card__icon-wrap--purple">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                </svg>
              </div>
            </div>
            <div class="kpi-card__value" id="stat-capacity">—</div>
            <div class="kpi-card__label">Total Capacity</div>
          </div>

          <div class="kpi-card kpi-card--yellow">
            <div class="kpi-card__header">
              <div class="kpi-card__icon-wrap kpi-card__icon-wrap--yellow">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
                </svg>
              </div>
            </div>
            <div class="kpi-card__value" id="stat-zones">—</div>
            <div class="kpi-card__label">Total Zones</div>
          </div>
        </div>

        <!-- Section Header -->
        <div class="section-header">
          <div>
            <div class="section-title">All Warehouses</div>
            <div class="section-subtitle">Click a card to view zones and bins</div>
          </div>
        </div>

        <!-- Warehouse Cards Grid -->
        <div id="warehouses-container">
          <div class="warehouse-grid">
            <div class="skeleton" style="height:220px;border-radius:14px"></div>
            <div class="skeleton" style="height:220px;border-radius:14px"></div>
            <div class="skeleton" style="height:220px;border-radius:14px"></div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- ===================================================
       ZONES MODAL
       =================================================== -->
  <div class="modal-backdrop" id="zones-modal-backdrop">
    <div class="modal modal--wide">
      <div class="modal__header">
        <div>
          <div class="modal__title" id="modal-wh-name">Warehouse Zones</div>
          <div style="font-size:.8125rem;color:var(--clr-text-secondary);margin-top:.125rem" id="modal-wh-location"></div>
        </div>
        <button class="modal__close" id="modal-close-btn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal__body" id="zones-content">
        <div class="page-loading">
          <div class="spinner"></div>
          <span>Loading zones…</span>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script type="module" src="../js/warehouses.js"></script>
</body>
</html>
