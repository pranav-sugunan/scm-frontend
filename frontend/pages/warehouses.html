<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warehouses — SCM Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebar-container"></div>
      <main class="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Warehouses</h1>
            <p class="page-header__subtitle" id="wh-subtitle">Loading…</p>
          </div>
          <div class="page-header__actions">
            <button class="btn btn--primary" id="btn-new-warehouse">
              <i data-lucide="plus" style="width: 16px; height: 16px"></i> New
              Warehouse
            </button>
          </div>
        </div>

        <!-- Overview Metrics -->
        <div class="metric-row" id="wh-overview-metrics">
          <div class="metric-card skeleton-h"></div>
          <div class="metric-card skeleton-h"></div>
          <div class="metric-card skeleton-h"></div>
          <div class="metric-card skeleton-h"></div>
        </div>

        <!-- Warehouse Selector -->
        <section class="section">
          <div class="section-head">
            <h2 class="section-head__title">Facilities</h2>
            <span class="text-xs text-muted"
              >Select a facility to view complete details</span
            >
          </div>
          <div class="toolbar" style="margin-bottom: 0.75rem">
            <div class="toolbar__search">
              <i class="toolbar__search-icon" data-lucide="search"></i>
              <input
                id="wh-search"
                class="form-input"
                type="text"
                placeholder="Search by name, code, city..."
              />
            </div>
            <select class="toolbar__select" id="wh-status-filter">
              <option value="">All Statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="maintenance">Maintenance</option>
            </select>
            <select class="toolbar__select" id="wh-type-filter">
              <option value="">All Types</option>
              <option value="fulfillment_center">Fulfillment Center</option>
              <option value="distribution_center">Distribution Center</option>
              <option value="cold_storage">Cold Storage</option>
              <option value="regional_hub">Regional Hub</option>
            </select>
          </div>
          <div class="table-wrapper" id="wh-table-container"></div>
        </section>

        <!-- Warehouse Detail (hidden initially) -->
        <div id="wh-detail" style="display: none">
          <div class="wh-info-bar" id="wh-info-bar"></div>
          <div class="metric-row" id="wh-analytics"></div>

          <!-- AI Simulation Panel -->
          <div class="panel" style="margin-top: 0.75rem">
            <div class="panel__head">
              <h3 class="panel__title">
                <i
                  data-lucide="sparkles"
                  style="width: 14px; height: 14px; color: var(--clr-primary)"
                ></i>
                AI Throughput Simulation
              </h3>
            </div>
            <div class="panel__body" id="sim-results">
              <div class="spinner spinner--sm" style="margin: 1rem auto"></div>
            </div>
          </div>

          <div class="panel" style="margin-top: 0.75rem">
            <div class="panel__head">
              <h3 class="panel__title">Floor Layout</h3>
              <div style="display: flex; gap: 0.5rem">
                <button class="btn btn--ghost btn--sm" id="btn-add-zone">
                  <i data-lucide="plus" style="width: 14px; height: 14px"></i>
                  Zone
                </button>
                <button class="btn btn--ghost btn--sm" id="btn-add-bin">
                  <i data-lucide="plus" style="width: 14px; height: 14px"></i>
                  Bin
                </button>
              </div>
            </div>
            <div class="panel__body" id="building-map-container"></div>
          </div>
        </div>

        <!-- Empty state -->
        <div id="wh-empty" class="empty-state" style="padding: 4rem">
          <div class="empty-state__icon"><i data-lucide="warehouse"></i></div>
          <div class="empty-state__title">Select a warehouse</div>
          <div class="empty-state__description">
            Click a warehouse above to view its details, zones, and bin layout.
          </div>
        </div>
      </main>
    </div>

    <!-- Create Warehouse Modal -->
    <div class="modal-backdrop" id="create-wh-modal" style="display: none">
      <div class="modal" style="max-width: 520px">
        <div class="modal__header">
          <h3 class="modal__title">Create Warehouse</h3>
          <button class="modal__close" id="create-wh-close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal__body">
          <div class="form-group">
            <label class="form-label">Name</label>
            <input
              type="text"
              class="form-input"
              id="wh-name"
              placeholder="Warehouse name"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Code</label>
            <input
              type="text"
              class="form-input"
              id="wh-code"
              placeholder="e.g. WH-MUM-01"
            />
          </div>
          <div
            style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem"
          >
            <div class="form-group">
              <label class="form-label">Address</label>
              <input
                type="text"
                class="form-input"
                id="wh-address"
                placeholder="Street address"
              />
            </div>
            <div class="form-group">
              <label class="form-label">City</label>
              <input
                type="text"
                class="form-input"
                id="wh-city"
                placeholder="City"
              />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">State</label>
            <input
              type="text"
              class="form-input"
              id="wh-state"
              placeholder="State"
            />
          </div>
          <div
            style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem"
          >
            <div class="form-group">
              <label class="form-label">Type</label>
              <select class="form-select" id="wh-type">
                <option value="fulfillment_center">Fulfillment Center</option>
                <option value="distribution_center">Distribution Center</option>
                <option value="cold_storage">Cold Storage</option>
                <option value="regional_hub">Regional Hub</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Capacity (sqft)</label>
              <input
                type="number"
                class="form-input"
                id="wh-capacity"
                min="0"
                placeholder="0"
              />
            </div>
          </div>
        </div>
        <div class="modal__footer">
          <button class="btn btn--ghost" id="create-wh-cancel">Cancel</button>
          <button class="btn btn--primary" id="create-wh-submit">Create</button>
        </div>
      </div>
    </div>

    <!-- Create Zone Modal -->
    <div class="modal-backdrop" id="create-zone-modal" style="display: none">
      <div class="modal">
        <div class="modal__header">
          <h3 class="modal__title">Create Zone</h3>
          <button class="modal__close" id="create-zone-close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal__body">
          <div class="form-group">
            <label class="form-label">Zone Name</label>
            <input
              type="text"
              class="form-input"
              id="zone-name"
              placeholder="Zone name"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Zone Type</label>
            <select class="form-select" id="zone-type">
              <option value="storage">Storage</option>
              <option value="picking">Picking</option>
              <option value="receiving">Receiving</option>
              <option value="packing">Packing</option>
              <option value="shipping">Shipping</option>
              <option value="cold">Cold</option>
              <option value="hazmat">Hazmat</option>
            </select>
          </div>
        </div>
        <div class="modal__footer">
          <button class="btn btn--ghost" id="create-zone-cancel">Cancel</button>
          <button class="btn btn--primary" id="create-zone-submit">
            Create
          </button>
        </div>
      </div>
    </div>

    <!-- Create Bin Modal -->
    <div class="modal-backdrop" id="create-bin-modal" style="display: none">
      <div class="modal">
        <div class="modal__header">
          <h3 class="modal__title">Create Bin</h3>
          <button class="modal__close" id="create-bin-close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal__body">
          <div class="form-group">
            <label class="form-label">Zone</label>
            <select class="form-select" id="bin-zone-select">
              <option value="">Select zone</option>
            </select>
          </div>
          <div
            style="
              display: grid;
              grid-template-columns: 1fr 1fr 1fr;
              gap: 0.75rem;
            "
          >
            <div class="form-group">
              <label class="form-label">Aisle</label>
              <input
                type="text"
                class="form-input"
                id="bin-aisle"
                placeholder="e.g. A"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Rack</label>
              <input
                type="text"
                class="form-input"
                id="bin-rack"
                placeholder="e.g. 01"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Shelf</label>
              <input
                type="text"
                class="form-input"
                id="bin-shelf"
                placeholder="e.g. 01"
              />
            </div>
          </div>
          <div
            style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem"
          >
            <div class="form-group">
              <label class="form-label">Bin Code</label>
              <input
                type="text"
                class="form-input"
                id="bin-code"
                placeholder="e.g. A-01-01"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Capacity (units)</label>
              <input
                type="number"
                class="form-input"
                id="bin-capacity"
                min="0"
                value="100"
              />
            </div>
          </div>
        </div>
        <div class="modal__footer">
          <button class="btn btn--ghost" id="create-bin-cancel">Cancel</button>
          <button class="btn btn--primary" id="create-bin-submit">
            Create
          </button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="../js/warehouses.js"></script>
  </body>
</html>
