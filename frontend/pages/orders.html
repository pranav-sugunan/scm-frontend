<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders — SCM Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebar-container"></div>
      <main class="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Orders</h1>
            <p class="page-header__subtitle" id="orders-subtitle">Loading…</p>
          </div>
          <div class="page-header__actions">
            <button class="btn btn--primary" id="btn-new-order">
              <i data-lucide="plus" style="width: 16px; height: 16px"></i> New
              Order
            </button>
          </div>
        </div>

        <!-- Analytics Metrics -->
        <div class="metric-row" id="order-metrics">
          <div class="metric-card skeleton-h"></div>
          <div class="metric-card skeleton-h"></div>
          <div class="metric-card skeleton-h"></div>
          <div class="metric-card skeleton-h"></div>
        </div>

        <!-- Pipeline -->
        <section class="section">
          <div class="section-head">
            <h2 class="section-head__title">Pipeline</h2>
            <span class="text-xs text-muted" id="pipeline-hint"
              >Click a stage to filter</span
            >
          </div>
          <div id="order-pipeline"></div>
        </section>

        <!-- Toolbar -->
        <div class="toolbar">
          <div class="toolbar__search">
            <i data-lucide="search"></i>
            <input
              type="text"
              class="form-input"
              id="search-input"
              placeholder="Search orders…"
            />
          </div>
          <select class="form-select" id="filter-status">
            <option value="">All statuses</option>
            <option value="created">Created</option>
            <option value="allocated">Allocated</option>
            <option value="picked">Picked</option>
            <option value="packed">Packed</option>
            <option value="shipped">Shipped</option>
            <option value="in_transit">In Transit</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
            <option value="returned">Returned</option>
          </select>
          <select class="form-select" id="filter-priority">
            <option value="">All priorities</option>
            <option value="critical">Critical</option>
            <option value="express">Express</option>
            <option value="standard">Standard</option>
          </select>
          <button
            class="btn btn--ghost btn--sm"
            id="btn-clear-filters"
            style="display: none"
          >
            <i data-lucide="x"></i> Clear
          </button>
        </div>

        <!-- Table -->
        <div class="table-wrapper" id="orders-table-container"></div>
        <div id="orders-pagination"></div>
      </main>
    </div>

    <!-- Status Update Modal -->
    <div class="modal-backdrop" id="status-modal" style="display: none">
      <div class="modal">
        <div class="modal__header">
          <h3 class="modal__title">Update Status</h3>
          <button class="modal__close" id="status-modal-close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal__body">
          <p id="status-modal-info" class="text-sm text-muted mb-3"></p>
          <div class="form-group">
            <label class="form-label">New Status</label>
            <select class="form-select" id="status-modal-select">
              <option value="created">Created</option>
              <option value="allocated">Allocated</option>
              <option value="picked">Picked</option>
              <option value="packed">Packed</option>
              <option value="shipped">Shipped</option>
              <option value="in_transit">In Transit</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
              <option value="exception">Exception</option>
              <option value="returned">Returned</option>
            </select>
          </div>
        </div>
        <div class="modal__footer">
          <button class="btn btn--ghost" id="status-modal-cancel">
            Cancel
          </button>
          <button class="btn btn--primary" id="status-modal-confirm">
            Update
          </button>
        </div>
      </div>
    </div>

    <!-- Create Order Modal -->
    <div class="modal-backdrop" id="create-modal" style="display: none">
      <div class="modal" style="max-width: 560px">
        <div class="modal__header">
          <h3 class="modal__title">Create Order</h3>
          <button class="modal__close" id="create-modal-close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal__body">
          <div class="form-group">
            <label class="form-label">Customer Name</label>
            <input
              type="text"
              class="form-input"
              id="create-customer"
              placeholder="Customer name"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Customer ID</label>
            <input
              type="text"
              class="form-input"
              id="create-customer-id"
              placeholder="Customer ID"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Priority</label>
            <select class="form-select" id="create-priority">
              <option value="standard">Standard</option>
              <option value="express">Express</option>
              <option value="critical">Critical</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Shipping Address</label>
            <textarea
              class="form-textarea"
              id="create-address"
              rows="2"
              placeholder="Shipping address"
            ></textarea>
          </div>
          <div class="section-head" style="margin-top: 1rem">
            <h4 class="section-head__title">Order Items</h4>
            <button class="btn btn--ghost btn--sm" id="btn-add-item">
              <i data-lucide="plus" style="width: 14px; height: 14px"></i> Add
              Item
            </button>
          </div>
          <div id="order-items-container"></div>
        </div>
        <div class="modal__footer">
          <button class="btn btn--ghost" id="create-modal-cancel">
            Cancel
          </button>
          <button class="btn btn--primary" id="create-modal-submit">
            Create Order
          </button>
        </div>
      </div>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal-backdrop" id="detail-modal" style="display: none">
      <div class="modal" style="max-width: 640px">
        <div class="modal__header">
          <h3 class="modal__title" id="detail-modal-title">Order Detail</h3>
          <button class="modal__close" id="detail-modal-close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal__body" id="detail-modal-body"></div>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="../js/orders.js"></script>
  </body>
</html>
