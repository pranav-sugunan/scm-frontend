<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orders — SCM Platform</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/layout.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>

    <div style="flex:1;min-width:0">
      <div id="navbar-container"></div>

      <main class="main-content">

        <!-- Page Header -->
        <div class="page-header">
          <div class="page-header__left">
            <h1 class="page-header__title">Orders</h1>
            <p class="page-header__subtitle" id="orders-count">Loading…</p>
          </div>
          <div class="page-header__actions">
            <span class="badge badge--info" style="font-size:0.75rem;padding:.375rem .75rem">
              Auto-refresh 10s
            </span>
          </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
          <!-- Search -->
          <div class="toolbar__search">
            <svg class="toolbar__search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="search" class="toolbar__search-input"
              id="search-orders" placeholder="Search by ID, customer, SKU…" autocomplete="off"/>
          </div>

          <div class="toolbar__sep"></div>

          <!-- Filters -->
          <div class="toolbar__filter-group">
            <span class="toolbar__filter-label">Status:</span>
            <select class="toolbar__select" id="filter-status">
              <option value="">All Statuses</option>
              <option value="created">Created</option>
              <option value="allocated">Allocated</option>
              <option value="picked">Picked</option>
              <option value="packed">Packed</option>
              <option value="shipped">Shipped</option>
              <option value="in_transit">In Transit</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
              <option value="returned">Returned</option>
            </select>

            <span class="toolbar__filter-label">Priority:</span>
            <select class="toolbar__select" id="filter-priority">
              <option value="">All Priorities</option>
              <option value="critical">Critical</option>
              <option value="express">Express</option>
              <option value="standard">Standard</option>
            </select>

            <span class="toolbar__filter-label">Warehouse:</span>
            <select class="toolbar__select" id="filter-warehouse">
              <option value="">All Warehouses</option>
            </select>
          </div>

          <div class="toolbar__right">
            <button class="btn btn--ghost btn--sm" id="clear-filters">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
              Clear
            </button>
          </div>
        </div>

        <!-- Table -->
        <div id="orders-table-container">
          <div class="skeleton" style="height:400px;border-radius:14px"></div>
        </div>

        <!-- Pagination -->
        <div id="orders-pagination-container"></div>

      </main>
    </div>
  </div>

  <!-- ===================================================
       STATUS UPDATE MODAL
       =================================================== -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <div class="modal__header">
        <div class="modal__title">
          Update Order Status
          <span class="text-muted font-normal" style="font-size:.875rem" id="modal-order-id"></span>
        </div>
        <button class="modal__close" id="modal-cancel">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-group">
          <label class="form-label">Current Status</label>
          <div id="modal-current-status" style="margin-top:.25rem"></div>
        </div>
        <div class="form-group">
          <label class="form-label required" for="modal-new-status">New Status</label>
          <select class="form-select" id="modal-new-status"></select>
          <div class="form-hint">Select the new lifecycle status for this order.</div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--secondary" id="modal-cancel-footer"
          onclick="document.getElementById('modal-backdrop').classList.remove('active')">
          Cancel
        </button>
        <button class="btn btn--primary" id="modal-confirm">Save Changes</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script type="module" src="../js/orders.js"></script>
</body>
</html>
