<!--
  cards.html — Reusable card templates reference
  These are used as reference / copy-paste snippets.
  Dynamic rendering is handled in JS files.
-->

<!-- KPI Card Template -->
<template id="tpl-kpi-card">
  <div class="kpi-card">
    <div class="kpi-card__header">
      <div class="kpi-card__icon-wrap"></div>
      <div class="kpi-card__trend"></div>
    </div>
    <div class="kpi-card__value">—</div>
    <div class="kpi-card__label">Label</div>
    <div class="kpi-card__sublabel"></div>
  </div>
</template>

<!-- Anomaly Card Template -->
<template id="tpl-anomaly-card">
  <div class="anomaly-card">
    <div class="anomaly-card__icon"></div>
    <div class="anomaly-card__content">
      <div class="anomaly-card__title">Anomaly Title</div>
      <div class="anomaly-card__description">Description</div>
      <div class="anomaly-card__meta"></div>
    </div>
  </div>
</template>

<!-- Warehouse Card Template -->
<template id="tpl-warehouse-card">
  <div class="warehouse-card">
    <div class="warehouse-card__header">
      <div class="warehouse-card__icon"></div>
    </div>
    <div class="warehouse-card__name">Warehouse Name</div>
    <div class="warehouse-card__location">Location</div>
    <div class="warehouse-card__stats"></div>
  </div>
</template>

<!-- Empty State Template -->
<template id="tpl-empty-state">
  <div class="empty-state">
    <div class="empty-state__icon">
      <i data-lucide="inbox"></i>
    </div>
    <div class="empty-state__title">No data found</div>
    <div class="empty-state__description">
      Data will appear here once loaded.
    </div>
  </div>
</template>
