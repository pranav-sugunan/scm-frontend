<header class="navbar">
  <!-- Left: Page Title -->
  <div class="navbar__left">
    <div>
      <div class="navbar__page-title" id="nav-page-title">Dashboard</div>
    </div>

    <!-- Search -->
    <div class="navbar__search" style="margin-left: 1.5rem">
      <svg
        class="navbar__search-icon"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
      <input
        type="search"
        class="navbar__search-input"
        placeholder="Search orders, SKUs, tracking…"
        id="global-search"
        autocomplete="off"
      />
    </div>
  </div>

  <!-- Right: Actions -->
  <div class="navbar__right">
    <!-- Refresh Status -->
    <div class="navbar__refresh-status">
      <div class="navbar__refresh-dot"></div>
      <span>Live</span>
    </div>

    <div class="navbar__divider"></div>

    <!-- User -->
    <div class="navbar__user">
      <div class="navbar__user-avatar">SC</div>
      <span class="navbar__user-name">Admin</span>
    </div>
  </div>
</header>
